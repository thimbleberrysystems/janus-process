services:
  redis:
    image: redis:7-alpine
    container_name: janus-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  chromadb:
    image: chromadb/chroma:latest
    container_name: janus-chroma
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - CHROMA_SERVER_AUTHN_CREDENTIALS_FILE=
      - ANONYMIZED_TELEMETRY=false

  ollama:
    image: ollama/ollama:latest
    container_name: janus-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    command: ["serve"]
    environment:
      - OLLAMA_HOST=0.0.0.0:11434

volumes:
  redis_data:
  chroma_data:
  ollama_data:
